cv:
  name: Jiachang Zhang
  label: PhD Candidate in Astrophysics
  email: zhangjiachang@smail.nju.edu.cn
  address:
    city: Nanjing
    region: China
  website: https://jczhang-astro.github.io/
  image: ""
  summary: >-
    High-energy astrophysicist conducting systematic X-ray timing studies of
    compact-object populations in nearby galaxies. This work has led to discoveries
    including M31 UCXB-1 and motivates follow-up studies of unusual sources such as
    M81F4, alongside research on star clusters, ionized gas, and resolved stellar
    populations.

